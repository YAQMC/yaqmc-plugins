name: Sync client API
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: api-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run api:sync -- --latest
      - run: npm run pack && npm test
      - name: Commit validated API mirror
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk wit plugins/starter/API.md plugins/starter/api UPSTREAM.json
          git commit -m "docs(api): synchronize client SDK and offline reference"
          git push origin HEAD:main
